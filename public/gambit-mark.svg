<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <!-- Flat by construction: no gradient, no keylight, no blur. DESIGN.md allows
       the system exactly one gradient surface (Play), and a 2.1-deviation blur
       under 12px shapes only dirties the edges at the 44-52px the mark is ever
       drawn at. The plate fills the whole viewBox at the same ~31% radius the
       .logo box uses, so the CSS logo bloom hugs the art instead of haloing a
       smaller tile inset inside it. -->
  <defs>
    <clipPath id="gambit-plate">
      <rect width="64" height="64" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#gambit-plate)">
    <rect width="64" height="64" fill="#1f2a44"/>

    <!-- One rank of the board, in the blue ramp rather than the board's own
         cream-and-blue: the cream pawn has to separate from whatever it stands
         on, and cream squares put a bright square under half its base. The rank
         is phase-shifted by half a square so the pawn stands centred on one
         square instead of straddling the line between two, and that square is
         the darker of the pair. -->
    <rect y="48" width="64" height="16" fill="#3a64a0"/>
    <path fill="#5d8fc9" d="M8 48h16v16H8zM40 48h16v16H40z"/>

    <!-- A gambit is a pawn sacrifice, so the pawn is the name rather than a
         generic chess glyph. Studio Cream is the color DESIGN.md already
         assigns to the logo glyph and the Play glyph. Base bottom lands exactly
         on the rank's top edge — the piece rests on the board, never sunk into
         it. -->
    <g fill="#f1ecde">
      <circle cx="32" cy="14.56" r="7.51"/>
      <rect x="25.45" y="21.5" width="13.11" height="3.42" rx="1.43"/>
      <path d="M37.13 24.92c0 6.94 2.19 11.78 4.47 16.82H22.41c2.28-5.04 4.47-9.88 4.47-16.82z"/>
      <rect x="19.08" y="41.73" width="25.84" height="6.27" rx="2.57"/>
    </g>
  </g>

  <!-- Rim light: the raised-surface hairline from the tonal ladder, at 1.4 units
       so it still resolves at 44px instead of aliasing away. -->
  <rect x="0.7" y="0.7" width="62.6" height="62.6" rx="19.65" fill="none" stroke="#e8ecf5" stroke-opacity="0.1" stroke-width="1.4"/>
</svg>
